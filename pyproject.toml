[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "productionpulse"
version = "0.1.0"
description = "ProductionPulse Inclusive - Real-Time Production Decision and Execution Infrastructure (IBM track, Agentic Cinema)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ProductionPulse Team" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "jinja2>=3.1",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Confluent Cloud runtime. The local event bus is a drop-in replacement, so the
# fully offline demo does not need this.
confluent = [
  "confluent-kafka>=2.4",
]
# Vertex AI / ADK runtime. The offline reasoning plane is the default.
cloud = [
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "google-cloud-aiplatform[agent_engines,adk]>=1.101.0",
]
otel = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
# `tools/ui_smoke.py` drives the web client in a real browser. Deliberately not
# in `dev`: it pulls a ~190 MB browser download, and the ten-minute offline
# evaluation path in docs/JUDGE.md should not pay for that. CI installs it.
browser = [
  "playwright>=1.44",
]

[project.scripts]
productionpulse = "productionpulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
productionpulse = ["web/**/*", "schemas/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly rather than left to ruff's default set, which changes
# between releases. A lint configuration that drifts under CI is one nobody
# trusts, and CI here is meant to be believed.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The screenplay and the production world: scene action lines, dialogue and
# their translations. Rewrapping a line of a script to satisfy a line-length
# rule makes the script harder to read and the translations harder to compare.
"src/productionpulse/production/script.py" = ["E501"]
"src/productionpulse/production/world.py" = ["E501"]
# Role-specific communications are multi-line templates. A `noqa` inside one
# would be rendered into the message a crew member actually reads.
"src/productionpulse/agents/communication.py" = ["E501"]
# The legacy adapter is deliberately bad code, preserved as the "before" side of
# the IBM Bob modernization evidence. Linting it clean would destroy the
# artifact. See bob-evidence/USE_CASES.md#uc-03.
"src/productionpulse/systems/callsheet_legacy.py" = ["E501", "E741", "F841", "E722", "E711"]
